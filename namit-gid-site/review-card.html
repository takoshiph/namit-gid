<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Review cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Young+Serif&family=Caveat:wght@600&display=swap" rel="stylesheet">
<!-- Cards for Leny to tuck in the bag: print on letter paper (9 to a page,
     no scaling, background graphics on) and cut along the faint lines. The
     QR opens the review form: namitgid.takoshi.ca/?review=1 -->
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d8cdbd; font: 11px/1.4 'Atkinson Hyperlegible Next', Arial, sans-serif; color: #2B2119;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .help { max-width: 8.5in; margin: 18px auto 0; padding: 0 16px; font-size: 15px; }
  .help button { font: 600 16px/1 inherit; padding: 10px 18px; border-radius: 10px; border: 1.5px solid #8A5A30; background: #DDB582; cursor: pointer; }
  .page { width: 8.5in; height: 11in; margin: 18px auto; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); background: #fff; }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: .22in .2in; background: #F3EADB; outline: 1px dashed rgba(110, 82, 56, .25); outline-offset: -1px; }
  .card::before { content: ""; position: absolute; inset: .11in; border: 1.2px solid rgba(138, 90, 48, .45); border-radius: 11px 9px 10px 9px; pointer-events: none; }
  /* Leny's emblem with the shop name painted on her hanging board */
  .logo { position: relative; width: 1.2in; container-type: inline-size; }
  .logo img { display: block; width: 100%; height: auto; }
  .board { position: absolute; left: 51%; top: 82.5%; translate: -50% -50%; margin: 0; white-space: nowrap;
    font: 400 11.5cqw/1 'Young Serif', Georgia, serif; letter-spacing: -.01em; color: #3B2212; opacity: .9; mix-blend-mode: multiply;
    text-shadow: 0 0 1px rgba(40, 18, 6, .6); }
  .board span { color: #2B170B; }
  h1 { margin: .08in 0 0; font: 400 17px/1.15 'Young Serif', Georgia, serif; }
  .tr { margin: 0 0 .05in; font-size: 9.5px; font-style: italic; color: #6B5747; }
  .lead { margin: 0 0 .08in; max-width: 2.1in; color: #4A3B2F; }
  .qr { width: .92in; height: .92in; padding: .05in; background: #FFFBF3; border-radius: 6px; box-shadow: 0 0 0 1.2px rgba(138, 90, 48, .45); }
  .url { margin: .05in 0 0; font-size: 8.5px; color: #6B5747; }
  .sign { margin: .04in 0 0; font: 600 18px/1 Caveat, 'Segoe Print', cursive; color: #A3462A; }
  @media print { body { background: none; } .help { display: none; } .page { margin: 0; } }
  @media screen and (max-width: 8.6in) { .page { width: 100%; height: auto; grid-template: auto / 1fr; } .card { min-height: 3.67in; } .page .card:nth-child(n+2) { display: none; } }
</style>
</head>
<body>
<p class="help">Print on letter paper with <b>no scaling</b> and <b>background graphics on</b>, then cut along the faint lines. Nine cards a page. <button type="button" onclick="print()">Print</button></p>
<div class="page">
  <section class="card">
    <div class="logo"><img src="assets/img/emblem-480.webp" width="480" height="553" alt="Leny of Namit gid"><p class="board" aria-hidden="true">Namit <span>gid</span></p></div>
    <h1>Namit gid?</h1>
    <p class="tr">(Is it good?)</p>
    <p class="lead">Every review helps my little kitchen grow. Scan this and tell me in a line or two.</p>
    <img class="qr" src="assets/img/review-qr.svg" alt="QR code for the review form">
    <p class="url">or visit namitgid.takoshi.ca, Leave a review</p>
    <p class="sign">Salamat!</p>
  </section>
</div>
<script>
  // one card in the markup, nine on the page
  const page = document.querySelector('.page'), card = page.querySelector('.card');
  for (let i = 0; i < 8; i++) page.append(card.cloneNode(true));
</script>
</body>
</html>
