<!-- door-closed-night: the shut door at night, frame+leaf in one. Origin (0,0) = top-left of the opening (100x200), 1 unit = door width/100. viewBox -30 -14 160 304: light under the door and on the sand below y=200, small window glowing at x 36..64,y 32..64. Door base = (50,200). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -14 160 304" width="1280" height="2432">
<defs>
<filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".45 .012" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .12  0 0 0 .55 -.12"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<linearGradient id="p" x1="0" x2="1"><stop offset="0" stop-color="#5A4440"/><stop offset=".6" stop-color="#46364A"/><stop offset="1" stop-color="#352C46"/></linearGradient>
<linearGradient id="fr" x1="0" x2="1"><stop offset="0" stop-color="#4F3D44"/><stop offset="1" stop-color="#33293F"/></linearGradient>
<radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".8"/><stop offset=".5" stop-color="#FFB766" stop-opacity=".3"/><stop offset="1" stop-color="#FFB060" stop-opacity="0"/></radialGradient>
<radialGradient id="wg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".6"/><stop offset="1" stop-color="#FFB060" stop-opacity="0"/></radialGradient>
<filter id="b"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>
<ellipse cx="50" cy="48" rx="46" ry="42" fill="url(#wg)"/>
<ellipse cx="50" cy="238" rx="78" ry="38" fill="url(#pool)"/>
<g filter="url(#soft)">
<path d="M-12 -12H112L110 0H-10Z" fill="url(#fr)"/><path d="M-12 -10L0 0V200H-12Z" fill="url(#fr)"/><path d="M112 -10L100 0V200H112Z" fill="url(#fr)"/>
<path d="M-14 200H114V212H-14Z" fill="#2E2538"/>
<rect x="0" y="0" width="100" height="200" fill="url(#p)"/>
<g stroke="#241C2A" stroke-width=".9" opacity=".8"><path d="M20 0V200M40 0V200M60 0V200M80 0V200"/></g>
<g fill="#3E3040"><rect x="0" y="22" width="100" height="9"/><rect x="0" y="100" width="100" height="9"/><rect x="0" y="170" width="100" height="9"/></g>
</g>
<rect width="100" height="200" filter="url(#grain)" opacity=".5"/>
<rect x="36" y="32" width="28" height="32" rx="2" fill="#FFD28A"/><path d="M50 32V64M36 48H64" stroke="#5A4033" stroke-width="2"/><rect x="36" y="32" width="28" height="32" rx="2" fill="none" stroke="#2A2030" stroke-width="2"/>
<circle cx="85" cy="105" r="3.4" fill="#B8935A"/>
<rect x="0" y="195.5" width="100" height="4.5" fill="#FFD58A" filter="url(#b)"/><rect x="2" y="197" width="96" height="3" fill="#FFE6B0"/>
</svg>
