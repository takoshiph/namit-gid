<!-- door-light: origin (0,0) = top-left of the door opening, 1 unit = door width/100. viewBox -60 -20 220 330. Contains (a) the warm interior filling the opening 0..100 x 0..200, (b) a soft halo, (c) the pool on the sand: door base is y=200, pool spans y 200..285. Animate opacity to "breathe". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -20 220 330" width="1100" height="1650">
<defs>
<linearGradient id="in" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F2B25E"/><stop offset=".55" stop-color="#FFD58A"/><stop offset="1" stop-color="#FFE7B4"/></linearGradient>
<radialGradient id="h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD38A" stop-opacity=".5"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/></radialGradient>
<radialGradient id="pool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE2A6" stop-opacity=".85"/><stop offset=".5" stop-color="#FFC272" stop-opacity=".4"/><stop offset="1" stop-color="#FFB060" stop-opacity="0"/></radialGradient>
<filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
<radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1CF" stop-opacity=".5"/><stop offset="1" stop-color="#FFF1CF" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="50" cy="100" rx="105" ry="135" fill="url(#h)"/>
<ellipse cx="50" cy="236" rx="85" ry="38" fill="url(#pool)"/>
<rect x="-2" y="-2" width="104" height="204" fill="url(#in)"/>
<ellipse cx="50" cy="150" rx="48" ry="80" fill="url(#core)"/>
</svg>
